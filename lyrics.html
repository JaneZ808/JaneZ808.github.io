<style>
:root {
  --bg: #0b0a10; --bg2: #14121c;
  --text: #f2eff7; --muted: #9d93b5;
  --gold: #d8b46c; --gold-soft: rgba(216, 180, 108, .16);
  --surface: rgba(255, 255, 255, .045);
  --border: rgba(255, 255, 255, .09);
}
html[data-theme="light"] {
  --bg: #f7f5fa; --bg2: #efecf4;
  --text: #241f30; --muted: #6f6684;
  --surface: rgba(20, 16, 30, .04);
  --border: rgba(20, 16, 30, .12);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh;
  transition: background .5s ease, color .5s ease;
}
/* 背景 = 专辑封面铺底 + 双层暗化 */
.bg {
  position: fixed; inset: 0; z-index: -1;
  background: url('assets/img/hero-song.jpg') center / cover no-repeat;
}
.bg::after {
  content: ""; position: absolute; inset: 0;
  background:
    linear-gradient(180deg, rgba(8, 7, 13, .82), rgba(8, 7, 13, .72) 40%, rgba(8, 7, 13, .90)),
    radial-gradient(ellipse at 50% 0%, transparent 30%, rgba(8, 7, 13, .55));
}
html[data-theme="light"] .bg::after {
  background:
    linear-gradient(180deg, rgba(247, 245, 250, .86), rgba(247, 245, 250, .78) 40%, rgba(247, 245, 250, .93)),
    radial-gradient(ellipse at 50% 0%, transparent 30%, rgba(247, 245, 250, .6));
}

.wrap { max-width: 760px; margin: 0 auto; padding: 0 24px; }

/* 顶栏 */
.top {
  display: flex; align-items: center; justify-content: space-between;
  padding: 22px 0 8px;
}
.back {
  color: var(--muted); text-decoration: none; font-size: 14px; letter-spacing: .04em;
  transition: color .3s;
}
.back:hover { color: var(--gold); }
.theme-toggle {
  background: var(--surface); border: 1px solid var(--border); color: var(--muted);
  border-radius: 999px; padding: 7px 16px; font-size: 13px; cursor: pointer;
  transition: color .3s, border-color .3s;
}
.theme-toggle:hover { color: var(--gold); border-color: var(--gold); }

/* 头部卡：封面 + 歌名 */
.head {
  display: flex; gap: 28px; align-items: flex-end;
  padding: 46px 0 34px;
}
.cover {
  width: 168px; height: 168px; border-radius: 18px; overflow: hidden;
  box-shadow: 0 24px 70px rgba(0, 0, 0, .5), 0 0 0 1px rgba(255, 255, 255, .08);
  flex-shrink: 0; transform: rotate(-2.5deg);
  transition: transform .6s cubic-bezier(.2, .8, .2, 1);
}
.cover:hover { transform: rotate(0deg) scale(1.02); }
.cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.head-meta { min-width: 0; padding-bottom: 6px; }
.kicker {
  font-size: 12px; letter-spacing: .3em; color: var(--gold);
  margin-bottom: 14px; text-transform: uppercase;
}
h1 {
  font-size: clamp(30px, 5.4vw, 46px); font-weight: 600; letter-spacing: .04em;
  line-height: 1.15; margin-bottom: 10px;
}
.artist { color: var(--muted); font-size: 15px; letter-spacing: .06em; }
.credits {
  color: var(--muted); font-size: 12.5px; line-height: 2; margin-top: 14px;
  letter-spacing: .03em;
}
.credits b { color: var(--text); font-weight: 500; }

/* 播放器 */
.player {
  position: sticky; top: 0; z-index: 10;
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border-bottom: 1px solid var(--border);
  padding: 14px 0 16px;
}
.p-row { display: flex; align-items: center; gap: 16px; }
.p-btn {
  width: 46px; height: 46px; border-radius: 50%; border: none; cursor: pointer;
  background: linear-gradient(135deg, var(--gold), #b3924e);
  color: #17131f; display: grid; place-items: center; flex-shrink: 0;
  box-shadow: 0 8px 26px rgba(216, 180, 108, .35);
  transition: transform .25s ease, box-shadow .25s ease;
}
.p-btn:hover { transform: scale(1.06); }
.p-btn:active { transform: scale(.96); }
.p-btn.playing { animation: pulse 2.4s ease-in-out infinite; }
@keyframes pulse { 0%,100% { box-shadow: 0 8px 26px rgba(216,180,108,.35); } 50% { box-shadow: 0 8px 34px rgba(216,180,108,.6); } }
.p-time { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; letter-spacing: .04em; flex-shrink: 0; }
.p-track { flex: 1; height: 5px; border-radius: 999px; background: var(--surface); position: relative; cursor: pointer; }
.p-track::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit;
  background: linear-gradient(90deg, var(--gold), #f0d890);
  transform-origin: left; transform: scaleX(0);
}
.p-track.played::before { transform: scaleX(var(--p, 0)); }
.p-knob {
  position: absolute; top: 50%; left: calc(var(--p, 0) * 100%);
  width: 13px; height: 13px; border-radius: 50%;
  background: #fff; box-shadow: 0 2px 10px rgba(0, 0, 0, .4);
  transform: translate(-50%, -50%) scale(0);
  transition: transform .2s;
}
.p-track:hover .p-knob { transform: translate(-50%, -50%) scale(1); }

/* 歌词 */
.lyrics {
  padding: 46px 0 30px;
  max-width: 600px;
  mask-image: linear-gradient(180deg, transparent 0, #000 7%, #000 92%, transparent);
  -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 7%, #000 92%, transparent);
}
.line {
  padding: 11px 2px;
  font-size: clamp(19px, 3.2vw, 24px);
  line-height: 1.55;
  color: var(--muted);
  letter-spacing: .02em;
  cursor: pointer;
  border-radius: 10px;
  transition: color .45s ease, transform .45s ease, text-shadow .45s ease, background .3s;
  transform-origin: left center;
  opacity: .78;
}
.line:hover { background: var(--surface); opacity: 1; }
.line.past { opacity: .5; font-size: clamp(16px, 2.6vw, 19px); padding: 9px 2px; }
.line.on {
  color: var(--text);
  opacity: 1;
  font-weight: 600;
  font-size: clamp(21px, 3.6vw, 27px);
  text-shadow: 0 0 26px rgba(216, 180, 108, .38);
  transform: scale(1.02);
}
.line.meta-line { font-size: 14px; opacity: .55; letter-spacing: .05em; cursor: default; }
.line.meta-line:hover { background: none; }
.outro {
  text-align: center; color: var(--muted); font-size: 13px; letter-spacing: .22em;
  padding: 56px 0 30px;
}

footer {
  border-top: 1px solid var(--border);
  padding: 26px 0 40px; margin-top: 20px;
  color: var(--muted); font-size: 12.5px; letter-spacing: .05em;
  display: flex; justify-content: space-between; gap: 14px; flex-wrap: wrap;
}
footer a { color: var(--muted); text-decoration: none; }
footer a:hover { color: var(--gold); }

@media (max-width: 640px) {
  .head { flex-direction: column; align-items: flex-start; gap: 22px; }
  .cover { width: 132px; height: 132px; }
  .p-row { flex-wrap: wrap; }
  .p-track { order: 5; flex-basis: 100%; }
}
</style>
